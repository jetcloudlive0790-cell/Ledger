<style>
  :root {
    --bg: #F2F4F8;
    --surface: #FFFFFF;
    --line: #E2E6EF;
    --text: #1B2130;
    --text-dim: #79828F;
    --accent: #1E6FFF;
    --accent-tint: #E9F0FF;
    --shadow: 0 6px 16px rgba(27, 33, 48, .10);
    --font: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.4;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 9px; flex: none; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
  .brand span { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .search { position: relative; flex: 1; max-width: 420px; margin-left: auto; }
  .search svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; stroke: var(--text-dim); pointer-events: none;
  }
  #q {
    width: 100%; height: 38px; padding: 0 34px;
    font-size: 14px; font-family: var(--font); color: var(--text);
    background: #F6F8FB; border: 1px solid var(--line); border-radius: 9px;
    outline: none; transition: border-color .15s, box-shadow .15s, background .15s;
  }
  #q::placeholder { color: #9AA3B2; }
  #q:focus { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  #clear {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; display: none; align-items: center; justify-content: center;
    border: 0; background: none; color: var(--text-dim); font-size: 15px; cursor: pointer; border-radius: 6px;
  }
  #clear:hover { background: var(--bg); color: var(--text); }

  main {
    max-width: 1680px; width: 100%; margin: 0 auto;
    padding: 14px 20px 10px;
  }
  .cols { display: grid; grid-template-columns: 1fr; gap: 22px; }
  @media (min-width: 900px) { .cols { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; } }

  section { min-width: 0; }
  section.hidden { display: none; }

  .sec-head { display: flex; align-items: center; gap: 8px; height: 26px; margin-bottom: 9px; }
  .sec-bar { width: 3px; height: 15px; border-radius: 2px; background: var(--g); flex: none; }
  .sec-title { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
  .sec-count {
    font-size: 12px; color: var(--text-dim); background: #fff;
    border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; line-height: 18px;
  }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (min-width: 640px) { .grid.fun-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 900px) { .grid.fun-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

  /* 宽屏时把高频三栏撑满首屏高度，卡片随之自动变高 */
  @media (min-width: 900px) {
    body { min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; display: flex; flex-direction: column; }
    .cols { flex: 1; }
    .cols > section { display: flex; flex-direction: column; }
    .cols .grid { flex: 1; grid-auto-rows: minmax(52px, 1fr); align-content: stretch; }
  }

  .card {
    display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 13px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    text-decoration: none; color: var(--text); min-width: 0;
    transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-1px); box-shadow: var(--shadow); border-color: var(--g-border); outline: none;
  }
  .card:active { transform: translateY(0); }
  .card.hidden { display: none; }
  .card.wide { grid-column: 1 / -1; }

  .ico {
    flex: none; width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: var(--g-tint); color: var(--g); font-size: 14.5px; font-weight: 700;
  }
  .name {
    min-width: 0; font-size: 15px; font-weight: 600; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .fun-wrap { margin-top: 20px; }

  .empty {
    display: none; padding: 56px 20px; text-align: center; color: var(--text-dim); font-size: 13.5px;
  }
  .empty.show { display: block; }
  .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 5px; }

  .tip { max-width: 1680px; width: 100%; margin: 0 auto; padding: 0 20px 14px; color: #9AA3B2; font-size: 11.5px; }

  @media (max-width: 899px) {
    header { flex-wrap: wrap; gap: 9px; padding: 10px 14px; }
    .brand { flex: 1; }
    .search { flex-basis: 100%; max-width: none; margin-left: 0; }
    #q { font-size: 16px; }
    main { padding: 12px 14px 8px; }
    .cols { gap: 18px; }
    .card { min-height: 46px; }
    .tip { padding: 0 14px 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
  }
</style>

</header>

function hostOf(url) {
  try { return new URL(url).host.replace(/^www\./, ''); }
  catch (e) { return url.replace(/^https?:\/\//, '').split('/')[0]; }
}

function initialOf(name) {
  const s = name.trim();
  if (!s) return '·';
  const m = s.match(/[A-Za-z0-9]/);
  if (m) return m[0].toUpperCase();
  return s.charAt(0);
}

function makeSection(group, gi, opts) {
  const pal = PALETTE[gi % PALETTE.length];
  const sec = document.createElement('section');
  sec.id = 'sec-' + gi;
  sec.style.setProperty('--g', pal.g);
  sec.style.setProperty('--g-tint', pal.tint);
  sec.style.setProperty('--g-border', pal.border);

  const head = document.createElement('div');
  head.className = 'sec-head';
  head.innerHTML = '<span class="sec-bar"></span><span class="sec-title"></span><span class="sec-count"></span>';
  head.querySelector('.sec-title').textContent = group.title;
  head.querySelector('.sec-count').textContent = group.links.length;

  const grid = document.createElement('div');
  grid.className = 'grid' + (opts.fun ? ' fun-grid' : '');

  group.links.forEach((link) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = link.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = link.name + '\n' + link.url;
    a.dataset.search = (link.name + ' ' + hostOf(link.url) + ' ' + link.url).toLowerCase();

    const ico = document.createElement('span');
    ico.className = 'ico';
    ico.textContent = initialOf(link.name);
    const nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = link.name;
    a.append(ico, nm);
    grid.appendChild(a);
  });

  sec.append(head, grid);
  return sec;
}

function build() {
  colsEl.innerHTML = '';
  funWrap.innerHTML = '';
  NAV_GROUPS.forEach((group, gi) => {
    // 娱乐组放到底部通栏，其余三组三栏全展示
    if (group.title.indexOf('娱乐') !== -1) {
      funWrap.appendChild(makeSection(group, gi, { fun: true }));
    } else {
      colsEl.appendChild(makeSection(group, gi, { fun: false }));
    }
  });
}

function fixOrphans() {
  [colsEl, funWrap].forEach((root) => {
    root.querySelectorAll('.grid').forEach((grid) => {
      const cards = [...grid.querySelectorAll('.card')].filter((c) => c.offsetParent !== null);
      cards.forEach((c) => c.classList.remove('wide'));
      if (cards.length < 2) return;
      const byRow = new Map();
      cards.forEach((c) => {
        const top = Math.round(c.offsetTop);
        if (!byRow.has(top)) byRow.set(top, []);
        byRow.get(top).push(c);
      });
      const rows = [...byRow.entries()].sort((a, b) => a[0] - b[0]);
      const last = rows[rows.length - 1][1];
      const perRow = rows[0][1].length;
      if (last.length === 1 && perRow > 1) last[0].classList.add('wide');
    });
  });
}

function filter() {
  const kw = qEl.value.trim().toLowerCase();
  clearEl.style.display = kw ? 'flex' : 'none';
  let visibleTotal = 0;

  mainEl.querySelectorAll('section').forEach((sec) => {
    const grid = sec.querySelector('.grid');
    grid.classList.toggle('searching', !!kw);
    let visible = 0;
    grid.querySelectorAll('.card').forEach((c) => {
      const hit = !kw || c.dataset.search.includes(kw);
      c.classList.toggle('hidden', !hit);
      if (hit) visible++;
    });
    sec.classList.toggle('hidden', visible === 0);
    visibleTotal += visible;
  });

  emptyEl.classList.toggle('show', visibleTotal === 0);
  fixOrphans();
}

let raf = 0;
qEl.addEventListener('input', () => {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(filter);
});
qEl.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { qEl.value = ''; filter(); }
  if (e.key === 'Enter') {
    const first = [...document.querySelectorAll('.card')].find((c) => c.offsetParent !== null);
    if (first) window.open(first.href, '_blank', 'noopener');
  }
});
clearEl.addEventListener('click', () => { qEl.value = ''; filter(); qEl.focus(); });

build();
filter();

let resizeRaf = 0;
window.addEventListener('resize', () => {
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(fixOrphans);
});
</script>
</body>
</html>
